<html>
<head>
    <title>Vehicles - Vehicle Rental System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include('./components/header.html') %}
     <div class="mainContent">
        
        <h2>All Vehicles</h2>

        <div class="filterBox">
            <h3>Filter Vehicles</h3>
            <form method="GET" action="/vehicles">
                <label>Type:</label>
                <select name="vehicleType">
                    <option value="">All Types</option>
                    <option value="sedan">Sedan</option>
                    <option value="suv">SUV</option>
                    <option value="truck">Truck</option>
                </select>
                
                <button type="submit">Filter</button>
            </form>
        </div>
        <div class="vehicleList">
            
            <div class="vehicleCard">
                <h3>Toyota Camry</h3>
                <p><strong>Type:</strong> Sedan</p>
                <p><strong>Year:</strong> 2023</p>
                <p><strong>Price:</strong> 5000000/day</p>
                <p><strong>Status:</strong> Available</p>
                <a href="/booking" class="bookButton">Book Now</a>
            </div>

            <div class="vehicleCard">
                <h3>Honda CRV</h3>
                <p><strong>Type:</strong> SUV</p>
                <p><strong>Year:</strong> 2022</p>
                <p><strong>Price:</strong> 7500000/day</p>
                <p><strong>Status:</strong> Available</p>
                <a href="/booking" class="bookButton">Book Now</a>
            </div>

        </div>
     </div>
    {% include('./components/footer.html') %}
</body>
</html>
