<!DOCTYPE html>
<html>
<head>
    <title>Login - Vehicle Rental System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    
    {% include('./components/header.html') %}

    <div class="mainContent">
        
        <div class="loginBox">
            <h2>Login</h2>
            
            <div class="loginTabs">
                <button id="adminTab" onclick="showAdminLogin()">Admin Login</button>
                <button id="customerTab" onclick="showCustomerLogin()">Customer Login</button>
            </div>
            
            <p id="messageBox"></p>
            
            <div id="adminLoginForm">
                <h3>Admin Login</h3>
                <form id="adminForm">
                    <label>Username:</label>
                    <input type="text" id="adminUsername" required>
                    <br><br>
                    
                    <label>Password:</label>
                    <input type="password" id="adminPassword" required>
                    <br><br>
                    
                    <button type="submit">Login as Admin</button>
                </form>
            </div>
            
            <div id="customerLoginForm" style="display: none;">
                <h3>Customer Login</h3>
                <form id="customerForm">
                    <label>Email:</label>
                    <input type="email" id="customerEmail" required>
                    <br><br>
                    
                    <label>Phone:</label>
                    <input type="text" id="customerPhone" required>
                    <br><br>
                    
                    <button type="submit">Login as Customer</button>
                </form>
            </div>

        </div>

    </div>

    {% include('./components/footer.html') %}



</body>
</html>
