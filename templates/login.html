<!DOCTYPE html>
<html>
<head>
    <title>Login - Vehicle Rental System</title>
        <link rel="stylesheet" href="/static/css/style.css">

    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
    {% include('./components/header.html') %}
        <div class="mainContent">
        
        <div class="loginContainer">
            <h2>Login</h2>
            
            <div class="loginTabs">
                <button class="tabButton active" id="adminTab" onclick="showAdminLogin()">Admin</button>
                <button class="tabButton" id="customerTab" onclick="showCustomerLogin()">Customer</button>
            </div>
            
            <p id="messageBox" class="messageBox"></p>
            
            <div id="adminLoginForm" class="loginFormSection">
                <form id="adminForm">
                    <div class="formGroup">
                        <label>Username:</label>
                        <input type="text" id="adminUsername" required>
                    </div>
                    
                    <div class="formGroup">
                        <label>Password:</label>
                        <input type="password" id="adminPassword" required>
                    </div>
                    
                    <button type="submit" class="loginButton">Login</button>
                </form>
            </div>
            
            <div id="customerLoginForm" class="loginFormSection" style="display: none;">
                <form id="customerForm">
                    <div class="formGroup">
                        <label>Email:</label>
                        <input type="email" id="customerEmail" required>
                    </div>
                    
                    <div class="formGroup">
                        <label>Phone:</label>
                        <input type="text" id="customerPhone" required>
                    </div>
                    
                    <button type="submit" class="loginButton">Login</button>
                </form>
            </div>

        </div>

    </div>

    {% include('./components/footer.html') %}

  <script src="/static/js/login.js"></script>
</body>
</html>
