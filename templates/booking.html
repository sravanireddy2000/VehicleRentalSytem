<html>
<head>
    <title>Book Vehicle - Vehicle Rental System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include('./components/header.html') %}
       <div class="mainContent" style="display: flex;justify-content: center;align-items: center;flex-direction: column;">
        
        <h2 style="color: aliceblue;">Book a Vehicle</h2>
         <div class="bookingForm">
           <h3>Vehicle Details</h3>
            <p><strong>Vehicle:</strong> <span id="vehicleName">{{ vehicle.brand }} {{ vehicle.model }}</span></p>
            <p><strong>Type:</strong> <span id="vehicleType">{{ vehicle.type }}</span></p>
            <p><strong>Price:</strong> <span id="pricePerDay">{{ vehicle.pricePerDay }}</span>/day</p>
            
            <hr>
          <h3>Customer Information</h3>
            <form id="bookingForm">
                <input type="hidden" id="vehicleId" value="{{ vehicle._id }}">
                <input type="hidden" id="priceValue" value="{{ vehicle.pricePerDay }}">
                
                <label>Full Name:</label>
                <input type="text" id="customerName" required>
                <br><br>
                
                <label>Email:</label>
                <input type="email" id="customerEmail" required>
                <br><br>
                
                <label>Phone:</label>
                <input type="text" id="customerPhone" required>
                <br><br>
                
                <label>Start Date:</label>
                <input type="date" id="startDate" required>
                <br><br>
                
                <label>End Date:</label>
                <input type="date" id="endDate" required>
                <br><br>
                
                <label>Total Days:</label>
                <input type="number" id="totalDays" value="0" readonly>
                <br><br>
                
                <label>Total Price:</label>
                <input type="text" id="totalPrice" value="0" readonly>
                <br><br>
                
                <button type="submit">Confirm Booking</button>
            </form>
            <p id="message"></p>
         </div>
       </div>
    {% include('./components/footer.html') %}
</body>
</html>
