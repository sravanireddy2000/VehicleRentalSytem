<html>
<head>
    <title>Book Vehicle - Vehicle Rental System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include('./components/header.html') %}
       <div class="mainContent" style="display: flex;justify-content: center;align-items: center;flex-direction: column;">
        
        <h2 style="color: aliceblue;">Book a Vehicle</h2>
         <div class="bookingForm">
            <h3>Vehicle Details</h3>
            <p><strong>Vehicle:</strong> Toyota Camry</p>
            <p><strong>Type:</strong> Sedan</p>
            <p><strong>Price:</strong> 5000000/day</p>
            
            <hr>
               <h3>Customer Information</h3>
            <form method="POST" action="/booking">
                
                <label>Full Name:</label>
                <input type="text" name="customerName" required>
                <br><br>
                
                <label>Email:</label>
                <input type="email" name="customerEmail" required>
                <br><br>
                
                <label>Phone:</label>
                <input type="text" name="customerPhone" required>
                <br><br>
                
                <label>Start Date:</label>
                <input type="date" name="startDate" required>
                <br><br>
                
                <label>End Date:</label>
                <input type="date" name="endDate" required>
                <br><br>
                
                <label>Total Days:</label>
                <input type="number" name="totalDays" value="1" readonly>
                <br><br>
                
                <label>Total Price:</label>
                <input type="text" name="totalPrice" value="5000000" readonly>
                <br><br>
                
                <button type="submit">Confirm Booking</button>
            </form>
         </div>
       </div>
    {% include('./components/footer.html') %}
</body>
</html>
